name: Hourly backup

on:
  schedule:
    # The database starts this job every hour (cron job hourly-backup-trigger in Supabase).
    # GitHub's timer is unreliable, so it is only a safety net in case that stops.
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Back up, encrypt and store
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash backup.sh
